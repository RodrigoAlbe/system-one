[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "system-one-native"
version = "1.1.0"
description = "Structured AI decisions with multiple providers and local response validation."
readme = "README.md"
authors = [
    { name = "Rodrigo & Contributors" }
]
license = { text = "MIT" }
keywords = ["system-one", "jev", "typesafe", "ai-decisions", "classification", "routing", "gemini", "groq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[project.scripts]
system-one = "system_one.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
